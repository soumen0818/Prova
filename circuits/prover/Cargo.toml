[package]
name = "prova-prover"
version = "0.1.0"
edition = "2021"
description = "Prova BLS12-381 Groth16 circuit + prover (arkworks). Phase 1."
license = "UNLICENSED"

[[bin]]
name = "prova-prover"
path = "src/bin/prova_prover.rs"

[dependencies]
ark-bls12-381 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-groth16 = "0.5"
ark-relations = "0.5"
ark-r1cs-std = "0.5"
ark-crypto-primitives = { version = "0.5", features = ["sponge", "r1cs", "snark"] }
ark-serialize = "0.5"
ark-snark = "0.5"
ark-std = "0.5"
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ark-ed-on-bls12-381 = { version = "0.5", features = ["r1cs"] }

[profile.release]
opt-level = 3
