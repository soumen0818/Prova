[package]
name = "prova-prover"
version = "0.1.0"
edition = "2021"
description = "Prova BLS12-381 Groth16 circuit + prover (arkworks). Phase 1."
license = "UNLICENSED"

# rlib for the CLI/tests; cdylib for the Android/iOS native module (on-device prover, Phase 4).
[lib]
name = "prova_prover"
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "prova-prover"
path = "src/bin/prova_prover.rs"

[dependencies]
ark-bls12-381 = "0.5"
ark-ec = "0.5"
ark-ff = "0.5"
ark-groth16 = "0.5"
ark-relations = "0.5"
ark-r1cs-std = "0.5"
ark-crypto-primitives = { version = "0.5", features = ["sponge", "r1cs", "snark"] }
ark-serialize = "0.5"
ark-snark = "0.5"
ark-std = "0.5"
rand = "0.8"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ark-ed-on-bls12-381 = { version = "0.5", features = ["r1cs"] }

# JNI bridge is only pulled for Android builds; host + iOS use the plain C ABI in ffi.rs.
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[profile.release]
opt-level = 3
