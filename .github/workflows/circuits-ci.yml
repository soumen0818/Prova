name: circuits-ci

on:
  push:
    branches: [main]
    paths: ['circuits/**', '.github/workflows/circuits-ci.yml']
  pull_request:
    branches: [main]
    paths: ['circuits/**', '.github/workflows/circuits-ci.yml']

defaults:
  run:
    working-directory: circuits/prover

jobs:
  prover:
    name: BLS12-381 Groth16 prover (arkworks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - run: cargo test
