name: Midnight CI

on:
  push:
    paths:
      - ".github/workflows/midnight-ci.yml"
      - "privacy/midnight/**"
  pull_request:
    paths:
      - ".github/workflows/midnight-ci.yml"
      - "privacy/midnight/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: midnight-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Compact contracts (39 tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: privacy/midnight

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: privacy/midnight/package-lock.json

      - name: Use Compact 0.31.1
        uses: midnightntwrk/setup-compact-action@v1
        with:
          compact-version: "0.31.1"

      - name: Install exact dependencies
        run: npm ci

      - name: Compile and test contracts
        run: npm test
