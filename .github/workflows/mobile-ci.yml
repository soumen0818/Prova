name: mobile-ci

on:
  push:
    branches: [main]
    paths: ['mobile/**', 'shared/**', '.github/workflows/mobile-ci.yml']
  pull_request:
    branches: [main]
    paths: ['mobile/**', 'shared/**', '.github/workflows/mobile-ci.yml']

defaults:
  run:
    working-directory: mobile

jobs:
  quality:
    name: Lint, typecheck & format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      # mobile consumes @prova/shared via a local file: dependency; build it first so its
      # dist/ exists for typecheck and bundling.
      - name: Build @prova/shared
        working-directory: shared
        run: |
          npm ci
          npm run build
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
